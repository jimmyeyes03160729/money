<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="欠款記帳" />
  <title>欠款記帳管理系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">

  <!-- 登入介面 (未登入時顯示) -->
  <div id="loginView" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-6 rounded-2xl shadow-md w-full max-w-sm border border-slate-200 space-y-4">
      <div class="text-center">
        <h1 class="text-xl font-bold text-slate-800">欠款記帳系統</h1>
        <p class="text-xs text-slate-500 mt-1">請輸入專屬帳號與密碼登入</p>
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">帳號</label>
        <input id="loginUser" type="text" placeholder="jimmyeyes" 
               autocapitalize="none" autocorrect="off" spellcheck="false"
               class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-600 mb-1">密碼</label>
        <input id="loginPass" type="password" placeholder="請輸入密碼" 
               autocapitalize="none" autocorrect="off"
               class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
      <p id="loginError" class="text-xs text-rose-500 hidden text-center">帳號或密碼錯誤！請注意大小寫。</p>
      <button onclick="handleLogin()" class="w-full bg-indigo-600 text-white py-2.5 rounded-xl font-semibold text-sm active:bg-indigo-700">登入</button>
    </div>
  </div>

  <!-- 主系統介面 (登入後顯示) -->
  <div id="mainApp" class="hidden max-w-md mx-auto px-4 py-4 space-y-4 pb-20">
    <!-- 頂部資訊 -->
    <header class="flex justify-between items-center bg-white px-4 py-3 rounded-2xl shadow-sm border border-slate-200">
      <div>
        <h1 class="text-base font-bold text-slate-800">誰欠我錢記帳簿</h1>
        <p class="text-[11px] text-slate-500">使用者：jimmyeyes</p>
      </div>
      <button onclick="handleLogout()" class="text-xs text-slate-400 hover:text-rose-500">登出</button>
    </header>

    <!-- 分頁切換 Tab -->
    <div class="flex bg-slate-200 p-1 rounded-xl">
      <button id="tabBtn1" onclick="switchTab(1)" class="flex-1 py-1.5 text-xs font-semibold rounded-lg bg-white shadow-sm text-slate-800">記一筆欠款</button>
      <button id="tabBtn2" onclick="switchTab(2)" class="flex-1 py-1.5 text-xs font-semibold rounded-lg text-slate-500">欠款總覽與結清</button>
    </div>

    <!-- TAB 1: 記錄支出流程 -->
    <div id="tabContent1" class="space-y-4">
      
      <!-- 第一步：選擇金錢屬性與人員 -->
      <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
        <div class="flex items-center justify-between">
          <h2 class="text-xs font-bold text-indigo-600 tracking-wider">STEP 1. 金錢屬性與人員</h2>
        </div>

        <!-- 屬性選擇 -->
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1.5">金錢屬性（點擊切換，右側✕可刪除自訂項）</label>
          <div id="categoryContainer" class="flex flex-wrap gap-2 mb-2"></div>
          <div class="flex gap-2">
            <input id="newCategoryInput" type="text" placeholder="自訂屬性 (如: 買菜代付)" class="flex-1 px-3 py-1.5 text-xs border border-slate-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-indigo-500">
            <button onclick="addCategory()" class="bg-slate-100 border border-slate-300 text-slate-700 text-xs px-3 py-1.5 rounded-lg active:bg-slate-200">新增屬性</button>
          </div>
        </div>

        <!-- 人員選擇與新增 -->
        <div class="pt-2 border-t border-slate-100">
          <div class="flex justify-between items-center mb-1.5">
            <label class="block text-xs font-medium text-slate-500">選擇本次欠款成員（可多選）</label>
            <button onclick="toggleAllMembers()" class="text-[11px] text-indigo-600">全選 / 取消</button>
          </div>
          <div id="memberCheckboxes" class="grid grid-cols-2 gap-2 bg-slate-50 p-2.5 rounded-xl border border-slate-200 mb-2"></div>
          <div class="flex gap-2">
            <input id="newMemberInput" type="text" placeholder="新增欠款人名稱" class="flex-1 px-3 py-1.5 text-xs border border-slate-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-indigo-500">
            <button onclick="addMember()" class="bg-slate-100 border border-slate-300 text-slate-700 text-xs px-3 py-1.5 rounded-lg active:bg-slate-200">新增人員</button>
          </div>
        </div>
      </section>

      <!-- 第二步：支出金額與明細 -->
      <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
        <h2 class="text-xs font-bold text-indigo-600 tracking-wider">STEP 2. 支出金額與細項</h2>
        
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">日期</label>
            <input id="recordDate" type="date" class="w-full px-3 py-2 text-xs border border-slate-300 rounded-xl focus:outline-none focus:ring-1 focus:ring-indigo-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">幣別</label>
            <select id="currencySelect" onchange="onCurrencyChange()" class="w-full px-3 py-2 text-xs border border-slate-300 rounded-xl bg-white focus:outline-none focus:ring-1 focus:ring-indigo-500">
              <option value="TWD">台幣 (TWD)</option>
              <option value="CNY">人民幣 (CNY)</option>
            </select>
          </div>
        </div>

        <!-- 人民幣即時匯率與信用卡手續費區塊 -->
        <div id="cnyConfigBox" class="hidden bg-amber-50 border border-amber-200 p-3 rounded-xl space-y-2.5">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-1.5">
              <span class="text-xs font-semibold text-amber-900">即時匯率 (1 CNY = ? TWD)</span>
              <span id="rateStatusBadge" class="text-[10px] text-emerald-700 bg-emerald-100 px-1.5 py-0.5 rounded">連線中</span>
            </div>
            <button type="button" onclick="fetchLiveExchangeRate()" class="text-[11px] text-amber-700 underline active:text-amber-900">🔄 重新抓取</button>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-[10px] font-medium text-amber-800 mb-1">牌告匯率 (可微調)</label>
              <input id="cnyRate" type="number" step="0.0001" value="4.55" oninput="updateCalcPreview()" 
                     class="w-full px-2.5 py-1.5 border border-amber-300 rounded-lg text-xs bg-white text-slate-800 font-semibold focus:outline-none focus:ring-1 focus:ring-amber-500">
            </div>
            <div>
              <label class="block text-[10px] font-medium text-amber-800 mb-1">信用卡海外手續費 (%)</label>
              <div class="relative">
                <input id="cardFeeRate" type="number" step="0.1" value="1.5" placeholder="1.5" oninput="updateCalcPreview()" 
                       class="w-full px-2.5 py-1.5 border border-amber-300 rounded-lg text-xs bg-white text-slate-800 font-semibold focus:outline-none focus:ring-1 focus:ring-amber-500 pr-6">
                <span class="absolute right-2 top-1.5 text-xs text-slate-400 font-bold">%</span>
              </div>
            </div>
          </div>
          <p class="text-[10px] text-amber-700">說明：一般海外信用卡手續費為 1.5%，若現金結算可設為 0%。</p>
        </div>

        <!-- 地點 (選擇出遊分攤時自動顯示) -->
        <div id="locationField" class="hidden">
          <label class="block text-xs font-medium text-slate-500 mb-1">出遊地點</label>
          <input id="recordLocation" type="text" placeholder="例如：花蓮、迪士尼、墾丁" class="w-full px-3 py-2 text-xs border border-slate-300 rounded-xl focus:outline-none focus:ring-1 focus:ring-indigo-500">
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">消費總金額 (原幣別)</label>
          <input id="recordAmount" type="number" min="0" placeholder="0" oninput="updateCalcPreview()" class="w-full px-3 py-2 text-sm font-semibold border border-slate-300 rounded-xl focus:outline-none focus:ring-1 focus:ring-indigo-500">
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">備註 / 項目說明</label>
          <input id="recordNote" type="text" placeholder="例如：代付民宿房費、晚餐" class="w-full px-3 py-2 text-xs border border-slate-300 rounded-xl focus:outline-none focus:ring-1 focus:ring-indigo-500">
        </div>
      </section>

      <!-- 第三步：即時換算與儲存 -->
      <section class="bg-indigo-50 border border-indigo-200 p-4 rounded-2xl space-y-3">
        <h2 class="text-xs font-bold text-indigo-900 tracking-wider">結算預覽 (新台幣四捨五入)</h2>
        <div class="space-y-1 text-xs text-indigo-950">
          <div class="flex justify-between">
            <span>折合新台幣總額（含卡費）：</span>
            <span class="font-bold text-sm text-indigo-700" id="previewTotalTWD">NT$ 0</span>
          </div>
          <div class="flex justify-between">
            <span>參與分攤成員數：</span>
            <span id="previewMemberCount">0 人</span>
          </div>
          <div class="flex justify-between border-t border-indigo-200 pt-1 text-sm font-bold">
            <span>每人應還新台幣：</span>
            <span class="text-rose-600" id="previewPerPersonTWD">NT$ 0</span>
          </div>
        </div>

        <button onclick="saveRecord()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold text-sm active:bg-indigo-700 shadow-md">
          儲存這筆紀錄
        </button>
      </section>

    </div>

    <!-- TAB 2: 人員欠款細項、總額與結清管理 -->
    <div id="tabContent2" class="hidden space-y-4">
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex justify-between items-center">
        <div>
          <span class="text-xs text-slate-500">目前總共借出未收回</span>
          <div class="text-xl font-bold text-rose-600" id="grandTotalDebt">NT$ 0</div>
        </div>
        <div class="text-xs text-slate-400">結算幣別：TWD</div>
      </div>

      <div id="membersDebtList" class="space-y-3"></div>
    </div>
  </div>

  <!-- 部分結清 Modal 彈窗 -->
  <div id="partialModal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-2xl shadow-xl border border-slate-200 p-4 space-y-4 max-h-[85vh] flex flex-col">
      <div class="flex justify-between items-center border-b border-slate-100 pb-2">
        <div>
          <h3 class="font-bold text-slate-800 text-sm">部分結清作業</h3>
          <p class="text-[11px] text-slate-400" id="modalMemberName">成員：</p>
        </div>
        <button onclick="closePartialModal()" class="text-slate-400 hover:text-slate-600 text-lg font-bold">✕</button>
      </div>

      <div class="text-xs text-slate-500 bg-amber-50 border border-amber-200 p-2 rounded-lg">
        請勾選<strong>「已還款」</strong>的項目，確認後點擊儲存，被勾選的項目將會被刪除結清。
      </div>

      <div id="modalItemsList" class="space-y-2 overflow-y-auto flex-1 pr-1 text-xs"></div>

      <div class="pt-2 border-t border-slate-100 flex gap-2">
        <button onclick="closePartialModal()" class="flex-1 py-2 rounded-xl border border-slate-300 text-slate-600 text-xs font-medium">取消</button>
        <button onclick="confirmPartialSettlement()" class="flex-1 py-2 rounded-xl bg-emerald-600 text-white text-xs font-bold active:bg-emerald-700">確認儲存變更</button>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_CATEGORIES = ['出遊分攤', '一般代墊'];

    let state = {
      isLoggedIn: localStorage.getItem('app_auth') === 'true',
      categories: JSON.parse(localStorage.getItem('app_categories')) || DEFAULT_CATEGORIES,
      selectedCategory: '出遊分攤',
      members: JSON.parse(localStorage.getItem('app_members')) || [],
      records: JSON.parse(localStorage.getItem('app_records')) || [] 
    };

    let activePartialMember = null;

    function init() {
      if (state.isLoggedIn) {
        document.getElementById('loginView').classList.add('hidden');
        document.getElementById('mainApp').classList.remove('hidden');
        document.getElementById('recordDate').value = new Date().toISOString().split('T')[0];
        renderCategories();
        renderMemberCheckboxes();
        updateCalcPreview();
        renderDebtsTab();
      } else {
        document.getElementById('loginView').classList.remove('hidden');
        document.getElementById('mainApp').classList.add('hidden');
      }
    }

    function handleLogin() {
      const user = document.getElementById('loginUser').value.trim().toLowerCase();
      const pass = document.getElementById('loginPass').value.trim();

      if (user === 'jimmyeyes' && pass === '22301989') {
        localStorage.setItem('app_auth', 'true');
        state.isLoggedIn = true;
        document.getElementById('loginError').classList.add('hidden');
        init();
      } else {
        document.getElementById('loginError').classList.remove('hidden');
      }
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !state.isLoggedIn) {
        handleLogin();
      }
    });

    function handleLogout() {
      if (confirm('確定要登出嗎？此裝置將需要重新輸入帳號密碼。')) {
        localStorage.removeItem('app_auth');
        state.isLoggedIn = false;
        init();
      }
    }

    function switchTab(tabIndex) {
      const tab1 = document.getElementById('tabContent1');
      const tab2 = document.getElementById('tabContent2');
      const btn1 = document.getElementById('tabBtn1');
      const btn2 = document.getElementById('tabBtn2');

      if (tabIndex === 1) {
        tab1.classList.remove('hidden');
        tab2.classList.add('hidden');
        btn1.className = 'flex-1 py-1.5 text-xs font-semibold rounded-lg bg-white shadow-sm text-slate-800';
        btn2.className = 'flex-1 py-1.5 text-xs font-semibold rounded-lg text-slate-500';
      } else {
        tab1.classList.add('hidden');
        tab2.classList.remove('hidden');
        btn2.className = 'flex-1 py-1.5 text-xs font-semibold rounded-lg bg-white shadow-sm text-slate-800';
        btn1.className = 'flex-1 py-1.5 text-xs font-semibold rounded-lg text-slate-500';
        renderDebtsTab();
      }
    }

    function renderCategories() {
      const container = document.getElementById('categoryContainer');
      container.innerHTML = state.categories.map(cat => {
        const isSelected = cat === state.selectedCategory;
        const isDefault = DEFAULT_CATEGORIES.includes(cat);
        return `
          <div class="inline-flex items-center rounded-lg border text-xs overflow-hidden transition ${
            isSelected ? 'bg-indigo-600 text-white border-indigo-600 shadow-sm' : 'bg-slate-50 text-slate-700 border-slate-200'
          }">
            <button type="button" onclick="selectCategory('${cat}')" class="px-3 py-1.5 font-medium">
              ${cat}
            </button>
            ${!isDefault ? `
              <button type="button" onclick="removeCategory('${cat}')" 
                      class="pr-2 pl-1 py-1.5 ${isSelected ? 'text-indigo-200 hover:text-white' : 'text-slate-400 hover:text-rose-500'} text-xs font-bold">
                ✕
              </button>
            ` : ''}
          </div>
        `;
      }).join('');

      const locField = document.getElementById('locationField');
      if (state.selectedCategory === '出遊分攤') {
        locField.classList.remove('hidden');
      } else {
        locField.classList.add('hidden');
      }
    }

    function selectCategory(cat) {
      state.selectedCategory = cat;
      renderCategories();
    }

    function addCategory() {
      const input = document.getElementById('newCategoryInput');
      const name = input.value.trim();
      if (name && !state.categories.includes(name)) {
        state.categories.push(name);
        state.selectedCategory = name;
        localStorage.setItem('app_categories', JSON.stringify(state.categories));
        input.value = '';
        renderCategories();
      }
    }

    function removeCategory(cat) {
      if (DEFAULT_CATEGORIES.includes(cat)) return;
      state.categories = state.categories.filter(c => c !== cat);
      if (state.selectedCategory === cat) {
        state.selectedCategory = DEFAULT_CATEGORIES[0];
      }
      localStorage.setItem('app_categories', JSON.stringify(state.categories));
      renderCategories();
    }

    // 第一步：成員渲染（支援保留目前勾選狀態）
    function renderMemberCheckboxes(preservedChecked = null) {
      const container = document.getElementById('memberCheckboxes');
      if (state.members.length === 0) {
        container.innerHTML = `<div class="col-span-2 text-center text-xs text-slate-400 py-2">目前常用名單為空，請於下方新增</div>`;
        return;
      }

      // 若未指定保留狀態，則讀取目前畫面上已勾選的名單
      let checkedSet;
      if (preservedChecked !== null) {
        checkedSet = new Set(preservedChecked);
      } else {
        const currentlyChecked = Array.from(document.querySelectorAll('input[name="splitMember"]:checked')).map(cb => cb.value);
        // 如果目前畫面上完全沒有 input (初次進入)，則預設全選
        checkedSet = currentlyChecked.length > 0 ? new Set(currentlyChecked) : new Set(state.members);
      }

      container.innerHTML = state.members.map(m => {
        const isChecked = checkedSet.has(m);
        return `
          <div class="flex items-center justify-between bg-white px-2 py-1.5 rounded-lg border border-slate-200">
            <label class="inline-flex items-center gap-1.5 text-xs text-slate-700 truncate cursor-pointer flex-1">
              <input type="checkbox" name="splitMember" value="${m}" ${isChecked ? 'checked' : ''} onchange="updateCalcPreview()" 
                     class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500">
              <span class="truncate">${m}</span>
            </label>
            <button onclick="removeMemberFromInput('${m}')" title="從常用名單移除" class="text-slate-300 hover:text-rose-500 text-xs px-1.5 font-bold">×</button>
          </div>
        `;
      }).join('');
    }

    // 新增人員：保留原本勾選的人，並將新成員預設勾選
    function addMember() {
      const input = document.getElementById('newMemberInput');
      const name = input.value.trim();
      if (name && !state.members.includes(name)) {
        // 先收集目前畫面上被勾選的人員
        const currentChecked = Array.from(document.querySelectorAll('input[name="splitMember"]:checked')).map(cb => cb.value);
        currentChecked.push(name); // 新成員預設勾選

        state.members.push(name);
        localStorage.setItem('app_members', JSON.stringify(state.members));
        input.value = '';

        // 傳入保留名單，避免重置其他人的勾選狀態
        renderMemberCheckboxes(currentChecked);
        updateCalcPreview();
      }
    }

    function removeMemberFromInput(name) {
      // 收集目前被勾選的人（排除被刪除者）
      const currentChecked = Array.from(document.querySelectorAll('input[name="splitMember"]:checked'))
                                  .map(cb => cb.value)
                                  .filter(m => m !== name);

      state.members = state.members.filter(m => m !== name);
      localStorage.setItem('app_members', JSON.stringify(state.members));

      renderMemberCheckboxes(currentChecked);
      updateCalcPreview();
      renderDebtsTab();
    }

    function toggleAllMembers() {
      const cbs = document.querySelectorAll('input[name="splitMember"]');
      const anyUnchecked = Array.from(cbs).some(cb => !cb.checked);
      cbs.forEach(cb => cb.checked = anyUnchecked);
      updateCalcPreview();
    }

    function onCurrencyChange() {
      const currency = document.getElementById('currencySelect').value;
      const box = document.getElementById('cnyConfigBox');
      if (currency === 'CNY') {
        box.classList.remove('hidden');
        fetchLiveExchangeRate();
      } else {
        box.classList.add('hidden');
        updateCalcPreview();
      }
    }

    async function fetchLiveExchangeRate() {
      const badge = document.getElementById('rateStatusBadge');
      badge.innerText = '抓取中...';
      badge.className = 'text-[10px] text-amber-700 bg-amber-100 px-1.5 py-0.5 rounded';

      try {
        const response = await fetch('https://open.er-api.com/v6/latest/CNY');
        const data = await response.json();

        if (data && data.rates && data.rates.TWD) {
          const liveRate = parseFloat(data.rates.TWD.toFixed(4));
          document.getElementById('cnyRate').value = liveRate;
          badge.innerText = '即時匯率已更新';
          badge.className = 'text-[10px] text-emerald-700 bg-emerald-100 px-1.5 py-0.5 rounded';
        } else {
          throw new Error('無法取得匯率數據');
        }
      } catch (err) {
        badge.innerText = '離線/自訂模式';
        badge.className = 'text-[10px] text-slate-500 bg-slate-200 px-1.5 py-0.5 rounded';
      }
      updateCalcPreview();
    }

    function updateCalcPreview() {
      const currency = document.getElementById('currencySelect').value;
      const rawAmount = parseFloat(document.getElementById('recordAmount').value) || 0;
      let totalTWD = 0;

      if (currency === 'CNY') {
        const rate = parseFloat(document.getElementById('cnyRate').value) || 4.55;
        const feePercent = parseFloat(document.getElementById('cardFeeRate').value) || 0;
        totalTWD = Math.round(rawAmount * rate * (1 + feePercent / 100));
      } else {
        totalTWD = Math.round(rawAmount);
      }

      const checkedMembers = Array.from(document.querySelectorAll('input[name="splitMember"]:checked'));
      const memberCount = checkedMembers.length;
      const perPersonTWD = memberCount > 0 ? Math.round(totalTWD / memberCount) : 0;

      document.getElementById('previewTotalTWD').innerText = `NT$ ${totalTWD.toLocaleString()}`;
      document.getElementById('previewMemberCount').innerText = `${memberCount} 人`;
      document.getElementById('previewPerPersonTWD').innerText = `NT$ ${perPersonTWD.toLocaleString()}`;
    }

    function saveRecord() {
      const date = document.getElementById('recordDate').value;
      const category = state.selectedCategory;
      const location = (category === '出遊分攤') ? document.getElementById('recordLocation').value.trim() : '';
      const currency = document.getElementById('currencySelect').value;
      const rawAmount = parseFloat(document.getElementById('recordAmount').value);
      const note = document.getElementById('recordNote').value.trim();

      const checkedMembers = Array.from(document.querySelectorAll('input[name="splitMember"]:checked')).map(cb => cb.value);

      if (!rawAmount || rawAmount <= 0) return alert('請輸入有效金額！');
      if (checkedMembers.length === 0) return alert('請至少勾選一位欠款人員！');
      if (category === '出遊分攤' && !location) return alert('「出遊分攤」請輸入地點！');

      let rate = 1.0;
      let cardFee = 0;
      let totalTWD = 0;

      if (currency === 'CNY') {
        rate = parseFloat(document.getElementById('cnyRate').value) || 4.55;
        cardFee = parseFloat(document.getElementById('cardFeeRate').value) || 0;
        totalTWD = Math.round(rawAmount * rate * (1 + cardFee / 100));
      } else {
        totalTWD = Math.round(rawAmount);
      }

      const perPersonTWD = Math.round(totalTWD / checkedMembers.length);

      const newRecord = {
        id: 'rec_' + Date.now(),
        date,
        category,
        location,
        currency,
        rate,
        cardFee,
        rawAmount,
        totalTWD,
        perPersonTWD,
        note: note || category,
        members: checkedMembers
      };

      state.records.push(newRecord);
      localStorage.setItem('app_records', JSON.stringify(state.records));

      document.getElementById('recordAmount').value = '';
      document.getElementById('recordNote').value = '';
      if (document.getElementById('recordLocation')) {
        document.getElementById('recordLocation').value = '';
      }
      updateCalcPreview();

      alert('紀錄已儲存！');
      switchTab(2);
    }

    function renderDebtsTab() {
      const container = document.getElementById('membersDebtList');
      let grandTotal = 0;

      const activeDebtorSet = new Set();
      state.records.forEach(r => {
        r.members.forEach(m => activeDebtorSet.add(m));
      });

      const allDisplayMembers = Array.from(new Set([...state.members, ...activeDebtorSet]));

      const memberDebts = {};
      allDisplayMembers.forEach(m => memberDebts[m] = []);

      state.records.forEach(r => {
        r.members.forEach(m => {
          if (!memberDebts[m]) memberDebts[m] = [];
          memberDebts[m].push({
            recordId: r.id,
            date: r.date,
            category: r.category,
            location: r.location,
            note: r.note,
            amountTWD: r.perPersonTWD,
            origCurrency: r.currency,
            origAmount: (r.rawAmount / r.members.length).toFixed(1),
            cardFee: r.cardFee
          });
          grandTotal += r.perPersonTWD;
        });
      });

      document.getElementById('grandTotalDebt').innerText = `NT$ ${grandTotal.toLocaleString()}`;

      if (allDisplayMembers.length === 0) {
        container.innerHTML = `<div class="bg-white p-6 rounded-2xl border border-slate-200 text-center text-xs text-slate-400">目前尚無任何人員或欠款資料</div>`;
        return;
      }

      const cardsHtml = allDisplayMembers.map(member => {
        const items = memberDebts[member] || [];
        const total = items.reduce((sum, it) => sum + it.amountTWD, 0);
        const isRemovedFromInput = !state.members.includes(member);

        if (isRemovedFromInput && items.length === 0) {
          return '';
        }

        if (items.length === 0) {
          return `
            <div class="bg-white p-3.5 rounded-2xl border border-slate-200 flex justify-between items-center opacity-70">
              <span class="font-bold text-xs text-slate-600">${member}</span>
              <span class="text-xs text-emerald-600 font-medium">已結清 (NT$ 0)</span>
            </div>
          `;
        }

        const itemsListHtml = items.map(it => `
          <div class="flex justify-between items-start py-1 border-b border-slate-100 last:border-0 text-[11px]">
            <div>
              <span class="text-slate-400 mr-1">${it.date}</span>
              <span class="inline-block bg-slate-200 text-slate-700 px-1 rounded text-[10px] mr-1">${it.category}</span>
              <span class="font-medium text-slate-700">${it.note}</span>
              ${it.location ? `<span class="text-indigo-500 ml-1">@${it.location}</span>` : ''}
              ${it.origCurrency === 'CNY' ? `<span class="text-amber-600 ml-1">(${it.origAmount} 人民幣含卡費${it.cardFee}%)</span>` : ''}
            </div>
            <span class="font-semibold text-slate-800">NT$ ${it.amountTWD.toLocaleString()}</span>
          </div>
        `).join('');

        return `
          <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
            <div class="flex justify-between items-center pb-2 border-b border-slate-100">
              <div>
                <span class="font-bold text-sm text-slate-800">${member}</span>
                ${isRemovedFromInput ? '<span class="text-[10px] bg-slate-100 text-slate-500 px-1.5 py-0.5 rounded ml-1.5">已從名單移除</span>' : ''}
                <span class="text-xs text-slate-400 ml-1">待還 (${items.length} 筆)</span>
              </div>
              <span class="font-bold text-base text-rose-600">NT$ ${total.toLocaleString()}</span>
            </div>

            <div class="space-y-1 bg-slate-50 p-2.5 rounded-xl border border-slate-100">
              ${itemsListHtml}
            </div>

            <div class="flex gap-2 pt-1">
              <button onclick="openPartialModal('${member}')" class="flex-1 py-1.5 rounded-lg border border-indigo-200 bg-indigo-50 text-indigo-700 text-xs font-semibold active:bg-indigo-100">
                部分結清
              </button>
              <button onclick="settleAllMemberDebts('${member}')" class="flex-1 py-1.5 rounded-lg bg-emerald-600 text-white text-xs font-semibold active:bg-emerald-700">
                全數結清
              </button>
            </div>
          </div>
        `;
      }).join('');

      container.innerHTML = cardsHtml;
    }

    function settleAllMemberDebts(member) {
      if (!confirm(`確定要將【${member}】的所有欠款全部結清清除嗎？`)) return;

      state.records.forEach(r => {
        r.members = r.members.filter(m => m !== member);
      });
      state.records = state.records.filter(r => r.members.length > 0);

      localStorage.setItem('app_records', JSON.stringify(state.records));
      renderDebtsTab();
      alert(`已將【${member}】的所有帳目結清！`);
    }

    function openPartialModal(member) {
      activePartialMember = member;
      document.getElementById('modalMemberName').innerText = `欠款成員：${member}`;

      const userItems = [];
      state.records.forEach(r => {
        if (r.members.includes(member)) {
          userItems.push({
            recordId: r.id,
            date: r.date,
            note: r.note,
            location: r.location,
            amount: r.perPersonTWD
          });
        }
      });

      const listContainer = document.getElementById('modalItemsList');
      listContainer.innerHTML = userItems.map((item) => `
        <label class="flex items-start gap-2 p-2 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 cursor-pointer">
          <input type="checkbox" name="partialCheckbox" value="${item.recordId}" class="mt-0.5 rounded text-emerald-600 focus:ring-emerald-500">
          <div class="flex-1">
            <div class="flex justify-between font-medium text-slate-800">
              <span>${item.note} ${item.location ? `(${item.location})` : ''}</span>
              <span class="text-rose-600">NT$ ${item.amount}</span>
            </div>
            <div class="text-[10px] text-slate-400">${item.date}</div>
          </div>
        </label>
      `).join('');

      document.getElementById('partialModal').classList.remove('hidden');
    }

    function closePartialModal() {
      document.getElementById('partialModal').classList.add('hidden');
      activePartialMember = null;
    }

    function confirmPartialSettlement() {
      if (!activePartialMember) return;
      const checkedBoxes = Array.from(document.querySelectorAll('input[name="partialCheckbox"]:checked'));
      if (checkedBoxes.length === 0) {
        alert('請至少勾選一筆已還款項目！');
        return;
      }

      const settledRecordIds = checkedBoxes.map(cb => cb.value);

      state.records.forEach(r => {
        if (settledRecordIds.includes(r.id)) {
          r.members = r.members.filter(m => m !== activePartialMember);
        }
      });

      state.records = state.records.filter(r => r.members.length > 0);
      localStorage.setItem('app_records', JSON.stringify(state.records));

      closePartialModal();
      renderDebtsTab();
      alert('已成功清除已還款細項並儲存！');
    }

    window.onload = init;
  </script>
</body>
</html>
